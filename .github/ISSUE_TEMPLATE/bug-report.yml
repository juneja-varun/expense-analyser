name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach a real bank statement or paste real transactions.**
        Describe the shape of the problem instead, or anonymise first —
        see [docs/anonymising-statements.md](../../blob/main/docs/anonymising-statements.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload an HDFC savings PDF
        2. Open the transactions list
        3. Dates are a month out
    validations:
      required: true

  - type: input
    id: bank
    attributes:
      label: Bank and statement type (if it's a parsing issue)
      placeholder: e.g. ICICI credit card PDF, April 2024

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Local development (make dev)
        - Docker (deploy/docker-compose.yml)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Redact any account numbers or personal details.
      render: shell
