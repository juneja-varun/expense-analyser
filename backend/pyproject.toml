[project]
name = "expense-analyser-backend"
version = "0.1.0"
description = "Personal finance app with Indian bank statement parsing, categorisation and budgeting"
authors = [{ name = "Varun Juneja" }]
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "django (>=5.1,<6.0)",
    "djangorestframework (>=3.15,<4.0)",
    "django-environ (>=0.11,<1.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "gunicorn (>=23.0,<24.0)",
    "whitenoise (>=6.7,<7.0)",
    # Statement parsing. pdfplumber handles both text extraction and the
    # encrypted PDFs most Indian card issuers email out.
    "pdfplumber (>=0.11,<1.0)",
    "openpyxl (>=3.1,<4.0)",
    "xlrd (>=2.0,<3.0)",
    # Bundled merchant patterns are YAML so non-Python contributors can extend them.
    "pyyaml (>=6.0,<7.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"
django-stubs = { extras = ["compatible-mypy"], version = "^5.1" }
djangorestframework-stubs = "^3.15"
# Used only to generate synthetic PDF fixtures — see the generator scripts under
# apps/parsers/banks/*/tests/. Not needed at runtime.
reportlab = "^4.2"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers -ra"
testpaths = ["apps", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "RUF012", # Django class attrs are conventionally mutable
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
