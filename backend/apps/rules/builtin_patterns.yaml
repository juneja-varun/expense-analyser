# Bundled merchant patterns for Indian statements.
#
# These become CategoryRule rows with origin=builtin for every household, so a
# first upload lands in sensible buckets before anyone configures anything.
# They are the lowest-priority rules: anything the user writes, and anything
# learned from their corrections, wins over these.
#
# ---------------------------------------------------------------------------
# Adding a merchant
# ---------------------------------------------------------------------------
#
#   - pattern: SWIGGY          # matched case-insensitively against the narration
#     category: Food & Dining > Eating Out > Food Delivery
#     match: contains          # optional, defaults to "contains"
#
# `category` is the full path in the default taxonomy (see
# apps/categories/taxonomy.py). A path that doesn't resolve is skipped, so a
# household that renamed or deleted a branch simply doesn't get those rules.
#
# ---------------------------------------------------------------------------
# ⚠️ Short names need `match: regex` with word boundaries
# ---------------------------------------------------------------------------
#
# A `contains` match on a short name will fire inside longer words, and the
# damage is silent — the transaction is quietly filed wrong.
#
#   CRED  matches "SALARY CREDIT"        → salary filed as a card payment
#   LIC   matches "POLICY", "PUBLIC"     → anything policy-related as insurance
#   OLA   matches "MOTOROLA", "CHOCOLATE"
#   ACT   matches "TRANSACTION", "CONTACT"
#
# If a name is under about six characters, or reads like a fragment of an
# ordinary English or banking word, use `match: regex` with `\b` on both sides.
# There are tests in tests/test_builtin_rules.py asserting exactly these cases
# stay fixed — add one when you add a risky pattern.

patterns:
  # --- Food delivery ------------------------------------------------------
  - { pattern: SWIGGY, category: "Food & Dining > Eating Out > Food Delivery" }
  - { pattern: ZOMATO, category: "Food & Dining > Eating Out > Food Delivery" }
