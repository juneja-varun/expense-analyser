  # --- Transport ----------------------------------------------------------
  - { pattern: UBER, category: "Transport > Cabs & Autos" }
  # OLA also appears inside MOTOROLA, CHOCOLATE, GOLA.
  - { pattern: '\bOLA\b', category: "Transport > Cabs & Autos", match: regex }
  - { pattern: RAPIDO, category: "Transport > Cabs & Autos" }
  - { pattern: INDIAN OIL, category: "Transport > Fuel" }
  - { pattern: INDIANOIL, category: "Transport > Fuel" }
  - { pattern: BHARAT PETROLEUM, category: "Transport > Fuel" }
  - { pattern: HINDUSTAN PETROLEUM, category: "Transport > Fuel" }
  - { pattern: NAYARA, category: "Transport > Fuel" }
  # HPCL/BPCL/IOCL are unambiguous as whole words but appear inside longer refs.
  - { pattern: '\b(HPCL|BPCL|IOCL)\b', category: "Transport > Fuel", match: regex }
  - { pattern: IRCTC, category: "Transport > Public Transport > Train" }
  - { pattern: METRO RAIL, category: "Transport > Public Transport > Metro" }
  - { pattern: '\b(DMRC|BMRCL)\b', category: "Transport > Public Transport > Metro", match: regex }
  - { pattern: FASTAG, category: "Transport > Vehicle > Parking & Tolls" }
  - { pattern: NETC, category: "Transport > Vehicle > Parking & Tolls" }

