  # --- Cash and income ----------------------------------------------------
  # ATM withdrawal markers vary by bank: HDFC writes ATW, others NWD or CASH WDL.
  - { pattern: '\b(ATW|NWD)\b', category: "Cash Withdrawal", match: regex }
  - { pattern: CASH WDL, category: "Cash Withdrawal" }
  - { pattern: ATM WDL, category: "Cash Withdrawal" }
